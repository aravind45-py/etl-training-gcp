steps:
  # 1. Enforce that PRs targeting 'main' MUST come from 'dev'
  - name: 'bash'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_BASE_BRANCH" = "main" ] && [ "$_HEAD_BRANCH" != "dev" ]; then
          echo "ERROR: Pull Requests targeting 'main' must originate from the 'dev' branch."
          echo "Current source branch: $_HEAD_BRANCH"
          exit 1
        fi
        echo "Source branch check passed. Target: $_BASE_BRANCH | Source: $_HEAD_BRANCH"

  # 2. Install & Compile Dataform definitions
  - name: 'node:18'
    entrypoint: 'npx'
    args: ['-p', '@dataform/cli@3.0.0', 'dataform', 'compile', '--vars=env=dev']

  # 3. Recursively validate Python Airflow DAG syntax
  - name: 'python:3.10-slim'
    entrypoint: 'python'
    args: ['-m', 'compileall', 'src/dags/']

options:
  logging: CLOUD_LOGGING_ONLY